  <body>
    <div id="app"></div>
    <div id="overlay-root"></div>
    <script>
      if (localStorage.getItem("astron-ui") !== "light-v30") {
        Object.keys(localStorage)
          .filter((k) => k.startsWith("astronrobotics") || k.startsWith("astron-cols") || k === "astron-ui")
          .forEach((k) => localStorage.removeItem(k));
        localStorage.setItem("astron-ui", "light-v30");
      }
    </script>
    <script type="importmap">

        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
